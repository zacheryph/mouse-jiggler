[package]
name = "esp32-mouse-jiggler"
version = "0.1.0"
authors = ["Zachery Hostens <zacheryph@gmail.com>"]
edition = "2024"
resolver = "2"
rust-version = "1.85"

# [[bin]]
# name = "esp-jiggler"
# harness = false # do not use the built in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice and they don't increase the size on Flash
opt-level = "z"

[features]
default = ["esp-idf-svc/native"]

experimental = ["esp-idf-svc/experimental"]

[dependencies]
esp-idf-hal = "0.45.2"
esp-idf-svc = "0.51"
esp-idf-sys = "0.36.1"
esp32-nimble = "0.11.1"
log = { version = "0.4", default-features = false }
zerocopy = "0.8.26"
zerocopy-derive = "0.8.26"

[build-dependencies]
embuild = "0.33"
